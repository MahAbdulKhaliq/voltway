# Monthly charger-map data refresh (CHECKLIST M5, DESIGN-map.md, owner decisions B27, B36, B77, B78).
# Downloads the AFDC stations for Canada and the US, then the Open Charge Map ones (B77, B78: at
# most 9 requests a month, see scripts/fetch-ocm.ts for OCM's fair-use rules), normalizes each
# country on its own and runs its sanity checks (scripts/lib/afdc-checks.ts). If any station
# changed, it opens (or updates) a pull request, runs the full CI steps here, and merges the PR
# itself only when every check and CI step passes. If an OCM download fails, last month's OCM data
# for that country stays and the rest still updates.
#
# Why CI runs here: pull requests opened with the workflow's GITHUB_TOKEN don't start
# other workflows (GitHub's guard against loops), so ci.yml would never run on them.
#
# Blocked path: a failed sanity check or CI step leaves the PR open and unmerged and
# fails the run, so the owner is emailed. The owner can review and merge it by hand.
# A manual run with "simulate_drop" ticked removes 15 % of stations to test this path.
#
# Needs: the NLR_API_KEY and OCM_API_KEY Actions secrets, and Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" (already on for data-refresh.yml).
name: Charger refresh

on:
  schedule:
    - cron: '41 10 1 * *' # 10:41 UTC on the 1st of each month (B36); run by hand any time
  workflow_dispatch:
    inputs:
      simulate_drop:
        description: 'Test the blocked path: drop 15 % of stations so the checks fail'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: charger-refresh
  cancel-in-progress: false

env:
  BRANCH: data/charger-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      # B78: both countries, Canada first. AFDC is the main source: a failed download fails the run.
      # The US raw file is ~300 MB, so the imports get a bigger heap (docs/tech-debt/ci-ops.md TD-O7).
      - name: Download AFDC Canada stations
        run: npm run fetch:afdc
        env:
          NLR_API_KEY: ${{ secrets.NLR_API_KEY }}

      - name: Download AFDC US stations
        run: npm run fetch:afdc -- --country=us
        env:
          NLR_API_KEY: ${{ secrets.NLR_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Simulate a drop (test run only)
        if: inputs.simulate_drop
        run: |
          npx tsx scripts/simulate-afdc-drop.ts 0.15
          npx tsx scripts/simulate-afdc-drop.ts 0.15 --country=us

      - name: Normalize AFDC Canada and run the sanity checks
        id: afdc_ca
        run: |
          if npm run import:afdc; then
            echo "checks=pass" >> "$GITHUB_OUTPUT"
          else
            echo "checks=fail" >> "$GITHUB_OUTPUT"
            # Write the data anyway, so the PR shows the owner what the source now says.
            npm run import:afdc -- --skip-checks
          fi

      - name: Normalize AFDC US and run the sanity checks
        id: afdc_us
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if npm run import:afdc -- --country=us; then
            echo "checks=pass" >> "$GITHUB_OUTPUT"
          else
            echo "checks=fail" >> "$GITHUB_OUTPUT"
            npm run import:afdc -- --country=us --skip-checks
          fi

      # Open Charge Map (B77, B78): one attempt per country, no retries (OCM's fair-use rules). A
      # failure keeps last month's OCM data for that country and doesn't stop the AFDC update.
      # Imports run after both AFDC imports: OCM duplicates are matched against every AFDC file.
      - name: Download Open Charge Map Canada stations
        id: fetch_ocm_ca
        continue-on-error: true
        run: npm run fetch:ocm
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}

      - name: Download Open Charge Map US stations
        id: fetch_ocm_us
        continue-on-error: true
        run: npm run fetch:ocm -- --country=us
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}

      - name: Normalize Open Charge Map Canada and run its checks
        id: ocm_ca
        if: steps.fetch_ocm_ca.outcome == 'success'
        continue-on-error: true
        run: |
          if npm run import:ocm; then
            echo "checks=pass" >> "$GITHUB_OUTPUT"
          else
            echo "checks=fail" >> "$GITHUB_OUTPUT"
            npm run import:ocm -- --skip-checks
          fi

      - name: Normalize Open Charge Map US and run its checks
        id: ocm_us
        if: steps.fetch_ocm_us.outcome == 'success'
        continue-on-error: true
        run: |
          if npm run import:ocm -- --country=us; then
            echo "checks=pass" >> "$GITHUB_OUTPUT"
          else
            echo "checks=fail" >> "$GITHUB_OUTPUT"
            npm run import:ocm -- --country=us --skip-checks
          fi

      # One result for all four: changed if any changed, checks pass only if every one that ran
      # passed, and one summary file for the PR body.
      - name: Combine the results
        id: all
        env:
          AFDC_CA_CHANGED: ${{ steps.afdc_ca.outputs.changed }}
          AFDC_CA_CHECKS: ${{ steps.afdc_ca.outputs.checks }}
          AFDC_CA_SUMMARY: ${{ steps.afdc_ca.outputs.summary }}
          AFDC_US_CHANGED: ${{ steps.afdc_us.outputs.changed }}
          AFDC_US_CHECKS: ${{ steps.afdc_us.outputs.checks }}
          AFDC_US_SUMMARY: ${{ steps.afdc_us.outputs.summary }}
          # success only if both the download and the import ran; otherwise last month's OCM data stays.
          OCM_CA_FETCH: ${{ (steps.fetch_ocm_ca.outcome == 'success' && steps.ocm_ca.outcome == 'success') && 'success' || 'failure' }}
          OCM_CA_CHANGED: ${{ steps.ocm_ca.outputs.changed }}
          OCM_CA_CHECKS: ${{ steps.ocm_ca.outputs.checks }}
          OCM_CA_SUMMARY: ${{ steps.ocm_ca.outputs.summary }}
          OCM_US_FETCH: ${{ (steps.fetch_ocm_us.outcome == 'success' && steps.ocm_us.outcome == 'success') && 'success' || 'failure' }}
          OCM_US_CHANGED: ${{ steps.ocm_us.outputs.changed }}
          OCM_US_CHECKS: ${{ steps.ocm_us.outputs.checks }}
          OCM_US_SUMMARY: ${{ steps.ocm_us.outputs.summary }}
        run: |
          summary="$RUNNER_TEMP/charger-summary.md"
          : > "$summary"
          changed=false
          checks=pass
          for cc in CA US; do
            c="AFDC_${cc}_CHANGED"; k="AFDC_${cc}_CHECKS"; m="AFDC_${cc}_SUMMARY"
            cat "${!m}" >> "$summary"; echo >> "$summary"
            if [ "${!c}" = "true" ]; then changed=true; fi
            if [ "${!k}" != "pass" ]; then checks=fail; fi
          done
          for cc in CA US; do
            f="OCM_${cc}_FETCH"; c="OCM_${cc}_CHANGED"; k="OCM_${cc}_CHECKS"; m="OCM_${cc}_SUMMARY"
            if [ "${!f}" = "success" ]; then
              cat "${!m}" >> "$summary"
              if [ "${!c}" = "true" ]; then changed=true; fi
              if [ "${!k}" != "pass" ]; then checks=fail; fi
            else
              echo "## Open Charge Map $cc" >> "$summary"
              echo "" >> "$summary"
              echo "**The Open Charge Map $cc download or import failed; last month's OCM $cc data is kept.** See the run log." >> "$summary"
              echo "::warning::Open Charge Map $cc download or import failed; last month's OCM $cc data is kept."
            fi
            echo >> "$summary"
          done
          # GitHub caps a PR body at 65,536 characters (QA 2026-11-18, B1): cut it short with a note if needed.
          if [ "$(wc -c < "$summary")" -gt 60000 ]; then
            # iconv -c drops a multi-byte character that the byte cut split in two.
            head -c 58000 "$summary" | { iconv -f UTF-8 -t UTF-8 -c || true; } > "$summary.cut"
            printf '\n\n**Summary cut short (too long for a pull request).** The full text is in the run page summary and the near-misses artifact.\n' >> "$summary.cut"
            cp "$summary" "$summary.full"
            mv "$summary.cut" "$summary"
          fi
          { echo "changed=$changed"; echo "checks=$checks"; echo "summary=$summary"; } >> "$GITHUB_OUTPUT"

      # The full near-miss lists (the PR body shows the closest 40 per country).
      - name: Keep the near-miss lists
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: near-misses
          path: sources/ocm-*/near-misses.md
          if-no-files-found: ignore

      - name: Nothing changed
        if: steps.all.outputs.changed != 'true'
        run: echo "No station was added, removed or changed. No pull request." >> "$GITHUB_STEP_SUMMARY"

      # A failed check with nothing to commit would otherwise end green and nobody would hear.
      - name: Checks failed with no change
        if: steps.all.outputs.changed != 'true' && steps.all.outputs.checks != 'pass'
        run: |
          echo "::error::Charger refresh: the sanity checks failed although no station changed. See the import step's output."
          exit 1

      - name: Commit the new data
        if: steps.all.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/imported/afdc/ sources/afdc-ca/FETCHED.json sources/afdc-us/FETCHED.json
          git add data/imported/ocm/ sources/ocm-ca/FETCHED.json sources/ocm-us/FETCHED.json 2>/dev/null || true
          git commit -m "Charger data refresh ($(date -u +%F))"

      # The same steps as ci.yml. Each records its result; one failing doesn't skip the others.
      - name: CI steps
        id: ci
        if: steps.all.outputs.changed == 'true'
        run: |
          status=pass
          results=""
          for step in "npm run validate" "npm test" "npx astro check" "npm run build"; do
            if $step; then results+="- \`$step\`: passed"$'\n'; else results+="- \`$step\`: **failed**"$'\n'; status=fail; fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          ci_block="$(printf '%s\n\n%s' '### CI steps (run in this workflow)' "$results")"
          printf '\n%s\n' "$ci_block" >> "$SUMMARY_FILE"
          # A cut-short PR body keeps the full text (.full) for the run page.
          if [ -f "$SUMMARY_FILE.full" ]; then printf '\n%s\n' "$ci_block" >> "$SUMMARY_FILE.full"; fi
        env:
          SUMMARY_FILE: ${{ steps.all.outputs.summary }}

      - name: Open or update the pull request
        if: steps.all.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ steps.all.outputs.summary }}
        run: |
          git push --force origin "$BRANCH"
          title="Charger data refresh ($(date -u +%F))"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$SUMMARY_FILE"
          else
            gh pr create --head "$BRANCH" --base main --title "$title" --body-file "$SUMMARY_FILE"
          fi
          if [ -f "$SUMMARY_FILE.full" ]; then cat "$SUMMARY_FILE.full"; else cat "$SUMMARY_FILE"; fi >> "$GITHUB_STEP_SUMMARY"

      - name: Merge (checks and CI passed, B27)
        if: steps.all.outputs.changed == 'true' && steps.all.outputs.checks == 'pass' && steps.ci.outputs.status == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$BRANCH" --squash --delete-branch
          echo "Merged. Vercel deploys from main." >> "$GITHUB_STEP_SUMMARY"

      - name: Blocked (left open for the owner)
        if: steps.all.outputs.changed == 'true' && (steps.all.outputs.checks != 'pass' || steps.ci.outputs.status != 'pass')
        run: |
          echo "::error::Charger refresh blocked: sanity checks ${{ steps.all.outputs.checks }}, CI ${{ steps.ci.outputs.status }}. The pull request stays open and unmerged."
          exit 1
